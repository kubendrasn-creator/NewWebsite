<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Brand Light Canvas -->
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="630" fill="#EEF7FD" fill-opacity="0.5"/>
  <rect x="24" y="24" width="1152" height="582" rx="32" stroke="#D4E8F7" stroke-width="2"/>
  
  <!-- Subtle Decorative Circles in Brand Logo Tints -->
  <circle cx="1060" cy="120" r="320" fill="#0088CC" fill-opacity="0.06"/>
  <circle cx="150" cy="520" r="260" fill="#0070A8" fill-opacity="0.05"/>
  <circle cx="950" cy="480" r="180" fill="#003074" fill-opacity="0.04"/>

  <!-- Logo Mark Container -->
  <g transform="translate(100, 90)">
    <rect width="64" height="64" rx="16" fill="#0070A8"/>
    <!-- Italic Forward Slanted Geometric 'i' motif -->
    <path d="M26 44L36 20H44L34 44H26Z" fill="#FFFFFF"/>
    <circle cx="39" cy="14" r="4.5" fill="#EEF7FD"/>
    <text x="84" y="44" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="38" font-weight="900" fill="#003074" letter-spacing="-0.03em">
      Apt <tspan fill="#0088CC">Infosoft</tspan>
    </text>
  </g>

  <!-- Tagline / Value Proposition -->
  <text x="100" y="250" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="#003074" letter-spacing="-0.03em">
    Engineering software that
  </text>
  <text x="100" y="315" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="#0088CC" letter-spacing="-0.03em">
    fits your business,
  </text>
  <text x="100" y="380" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="#0070A8" letter-spacing="-0.03em">
    built to last.
  </text>

  <!-- Capabilities Pill Row -->
  <g transform="translate(100, 440)">
    <rect width="1000" height="60" rx="16" fill="#FFFFFF" stroke="#D4E8F7" stroke-width="1.5"/>
    <text x="32" y="37" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#003074" letter-spacing="0.02em">
      Product Engineering • Custom Applications • SaaS • Modernization • Testing • Analytics
    </text>
  </g>

  <!-- Footer Delivery Model & URL -->
  <g transform="translate(100, 540)">
    <circle cx="10" cy="10" r="6" fill="#0088CC"/>
    <text x="28" y="16" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0070A8">
      Flexible Onsite &amp; Offshore Engagement • Bengaluru &amp; Atlanta
    </text>
  </g>
</svg>
